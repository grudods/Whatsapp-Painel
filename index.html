<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel WhatsApp - DS Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR - Lista de Conversas */
        .sidebar {
            width: 320px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            font-size: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .conversas-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .conversa-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }

        .conversa-item.aguardando {
            background: #e8f5e9;
            border-left-color: #4caf50;
        }

        .conversa-item.em-atendimento {
            background: #ffebee;
            border-left-color: #f44336;
        }

        .conversa-item.active {
            background: #667eea;
            color: white;
        }

        .conversa-item:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .conversa-nome {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .conversa-preview {
            font-size: 12px;
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversa-status {
            font-size: 11px;
            margin-top: 4px;
            opacity: 0.6;
        }

        /* MAIN - Chat */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 15px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .chat-info {
            display: flex;
            flex-direction: column;
        }

        .chat-title {
            font-weight: bold;
            font-size: 16px;
        }

        .chat-subtitle {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        .btn-primary:hover {
            transform: scale(1.05);
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover {
            background: #d32f2f;
        }

        /* MESSAGES */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 12px;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.cliente {
            justify-content: flex-start;
        }

        .message.funcionario {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 60%;
            padding: 12px 15px;
            border-radius: 10px;
            word-wrap: break-word;
            font-size: 14px;
        }

        .message.cliente .message-bubble {
            background: #e8eaed;
            color: #333;
            border-bottom-left-radius: 0;
        }

        .message.funcionario .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 0;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 4px;
            padding: 0 10px;
        }

        /* INPUT */
        .chat-input-area {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .btn-send {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-send:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-send:active {
            transform: scale(0.95);
        }

        /* PLACEHOLDER */
        .placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 16px;
            text-align: center;
        }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }
            .message-bubble {
                max-width: 85%;
            }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>💬 Conversas</span>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    <span id="status-text">Online</span>
                </div>
            </div>
            <div class="conversas-list" id="conversasList"></div>
        </div>

        <!-- MAIN CHAT -->
        <div class="main-chat">
            <!-- Chat Header -->
            <div class="chat-header" id="chatHeader" style="display: none;">
                <div class="chat-info">
                    <div class="chat-title" id="chatTitle">Selecione uma conversa</div>
                    <div class="chat-subtitle" id="chatStatus"></div>
                </div>
                <div class="chat-actions">
                    <button class="btn btn-primary" id="btnMarcarConcluida">✓ Marcar Concluída</button>
                    <button class="btn btn-danger" id="btnLimpar">Limpar</button>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages-container" id="messagesContainer">
                <div class="placeholder">Selecione uma conversa para começar</div>
            </div>

            <!-- Input -->
            <div class="chat-input-area" id="chatInputArea" style="display: none;">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="Digite sua resposta..."
                        autocomplete="off"
                    >
                    <button class="btn-send" id="btnEnviar">Enviar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // ===== CONFIG =====
        const SERVER_URL = 'http://localhost:3000'; // Muda aqui para seu backend
        let socket;
        let conversaSelecionada = null;
        let conversas = {};

        // ===== CONECTAR AO SERVER =====
        function conectarServer() {
            socket = io(SERVER_URL);

            socket.on('connect', () => {
                console.log('✅ Conectado ao servidor');
                document.getElementById('status-text').textContent = 'Online';
                document.querySelector('.status-dot').style.background = '#4caf50';
            });

            socket.on('disconnect', () => {
                console.log('❌ Desconectado do servidor');
                document.getElementById('status-text').textContent = 'Offline';
                document.querySelector('.status-dot').style.background = '#f44336';
            });

            // Receber nova mensagem
            socket.on('nova_mensagem', (dados) => {
                const { conversa_id, sender, message, timestamp } = dados;
                
                if (!conversas[conversa_id]) {
                    conversas[conversa_id] = {
                        id: conversa_id,
                        nome: sender,
                        status: 'aguardando',
                        mensagens: [],
                        ultimaMensagem: message,
                        operadorAtendimento: null
                    };
                }

                conversas[conversa_id].mensagens.push({
                    tipo: 'cliente',
                    texto: message,
                    timestamp: timestamp
                });

                conversas[conversa_id].ultimaMensagem = message;

                if (conversas[conversa_id].status === 'aguardando') {
                    conversas[conversa_id].status = 'aguardando';
                }

                atualizarListaConversas();

                if (conversaSelecionada === conversa_id) {
                    exibirMensagens(conversa_id);
                }
            });

            // Conversa foi pega por outro operador
            socket.on('conversa_pega', (dados) => {
                const { conversa_id, operador } = dados;
                if (conversas[conversa_id]) {
                    conversas[conversa_id].status = 'em-atendimento';
                    conversas[conversa_id].operadorAtendimento = operador;
                    atualizarListaConversas();

                    if (conversaSelecionada === conversa_id && operador !== obterOperadorAtual()) {
                        alert(`⚠️ ${operador} começou a atender este cliente!`);
                    }
                }
            });
        }

        // ===== ATUALIZAR LISTA DE CONVERSAS =====
        function atualizarListaConversas() {
            const lista = document.getElementById('conversasList');
            lista.innerHTML = '';

            Object.values(conversas)
                .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
                .forEach(conversa => {
                    const div = document.createElement('div');
                    div.className = `conversa-item ${conversa.status}`;
                    if (conversaSelecionada === conversa.id) {
                        div.classList.add('active');
                    }

                    div.innerHTML = `
                        <div class="conversa-nome">${conversa.nome}</div>
                        <div class="conversa-preview">${conversa.ultimaMensagem}</div>
                        <div class="conversa-status">
                            ${conversa.status === 'aguardando' ? '🟢 Aguardando' : '🔴 Em atendimento'}
                            ${conversa.operadorAtendimento ? ` por ${conversa.operadorAtendimento}` : ''}
                        </div>
                    `;

                    div.addEventListener('click', () => selecionarConversa(conversa.id));
                    lista.appendChild(div);
                });
        }

        // ===== SELECIONAR CONVERSA =====
        function selecionarConversa(conversa_id) {
            const conversa = conversas[conversa_id];
            
            if (conversa.status === 'aguardando') {
                // Notificar que você pegou
                socket.emit('pegar_conversa', {
                    conversa_id,
                    operador: obterOperadorAtual()
                });

                conversa.status = 'em-atendimento';
                conversa.operadorAtendimento = obterOperadorAtual();
            }

            conversaSelecionada = conversa_id;
            exibirMensagens(conversa_id);
            atualizarListaConversas();
        }

        // ===== EXIBIR MENSAGENS =====
        function exibirMensagens(conversa_id) {
            const conversa = conversas[conversa_id];
            const container = document.getElementById('messagesContainer');

            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('chatInputArea').style.display = 'flex';
            document.getElementById('chatTitle').textContent = conversa.nome;
            document.getElementById('chatStatus').textContent = 
                conversa.operadorAtendimento ? `Atendente: ${conversa.operadorAtendimento}` : 'Aguardando atendimento';

            container.innerHTML = '';

            conversa.mensagens.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.tipo}`;

                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = msg.texto;

                const time = document.createElement('div');
                time.className = 'message-time';
                time.textContent = new Date(msg.timestamp).toLocaleTimeString('pt-BR', {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                div.appendChild(bubble);
                div.appendChild(time);
                container.appendChild(div);
            });

            container.scrollTop = container.scrollHeight;
        }

        // ===== ENVIAR MENSAGEM =====
        document.getElementById('btnEnviar').addEventListener('click', enviarMensagem);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enviarMensagem();
        });

        function enviarMensagem() {
            const input = document.getElementById('messageInput');
            const texto = input.value.trim();

            if (!texto || !conversaSelecionada) return;

            const conversa = conversas[conversaSelecionada];
            conversa.mensagens.push({
                tipo: 'funcionario',
                texto,
                timestamp: new Date()
            });

            // Enviar pro servidor
            socket.emit('enviar_resposta', {
                conversa_id: conversaSelecionada,
                operador: obterOperadorAtual(),
                resposta: texto
            });

            input.value = '';
            exibirMensagens(conversaSelecionada);
        }

        // ===== MARCAR CONCLUÍDA =====
        document.getElementById('btnMarcarConcluida').addEventListener('click', () => {
            if (conversaSelecionada) {
                socket.emit('marcar_concluida', {
                    conversa_id: conversaSelecionada,
                    operador: obterOperadorAtual()
                });

                delete conversas[conversaSelecionada];
                conversaSelecionada = null;
                atualizarListaConversas();

                document.getElementById('chatHeader').style.display = 'none';
                document.getElementById('chatInputArea').style.display = 'none';
                document.getElementById('messagesContainer').innerHTML = 
                    '<div class="placeholder">Selecione uma conversa para começar</div>';
            }
        });

        // ===== LIMPAR =====
        document.getElementById('btnLimpar').addEventListener('click', () => {
            if (confirm('Tem certeza que deseja limpar esta conversa?')) {
                conversas[conversaSelecionada].mensagens = [];
                exibirMensagens(conversaSelecionada);
            }
        });

        // ===== UTILITÁRIOS =====
        function obterOperadorAtual() {
            return localStorage.getItem('operador') || 'Operador ' + Math.floor(Math.random() * 1000);
        }

        // ===== INICIAR =====
        window.addEventListener('load', () => {
            const nomeOperador = prompt('Qual é seu nome?', obterOperadorAtual());
            if (nomeOperador) {
                localStorage.setItem('operador', nomeOperador);
            }
            conectarServer();
        });
    </script>
</body>
</html>
